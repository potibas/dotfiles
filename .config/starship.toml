add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)${custom.keyboard_layout}$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# The session listener keeps this file current without querying Hyprland per prompt.
[custom.keyboard_layout]
command = 'cat "$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/keyboard-layout-label" 2>/dev/null'
when = 'test -n "$HYPRLAND_INSTANCE_SIGNATURE" && test -s "$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/keyboard-layout-label"'
shell = ["/bin/sh"]
format = '[\[$output\]]($style) '
style = "bold red"
